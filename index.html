<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graphic Portfolio XG</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Perfectly centered, zero-drift rotating rings */
        .ring {
            position: absolute;
            width: 120px;
            height: 120px;
            transform-origin: center center;
            will-change: transform;
            opacity: 0.85;
        }

        .ring svg {
            width: 100%;
            height: 100%;
        }

        /* Fast, locked-in-place spin speeds */
        .ring-1 { top: 15%; left: 10%; animation: spinCW 3s linear infinite; }
        .ring-2 { top: 70%; left: 15%; animation: spinCCW 2.5s linear infinite; }
        .ring-3 { top: 20%; left: 75%; animation: spinCW 3.5s linear infinite; }
        .ring-4 { top: 75%; left: 80%; animation: spinCCW 2.8s linear infinite; }
        .ring-5 { top: 45%; left: 48%; animation: spinCW 4s linear infinite; }

        @keyframes spinCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinCCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Subtle grey shapes */
        .shape {
            position: absolute;
            background-color: #1a1a1a;
            border: 1px solid #262626;
            opacity: 0.4;
        }

        .square { width: 22px; height: 22px; }
        .circle { width: 18px; height: 18px; border-radius: 50%; }
        
        .triangle {
            width: 0;
            height: 0;
            background-color: transparent;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #1a1a1a;
            border-top: none;
        }

        .s1 { top: 30%; left: 25%; }
        .s2 { top: 60%; left: 35%; }
        .s3 { top: 15%; left: 45%; }
        .s4 { top: 85%; left: 60%; }
        .s5 { top: 40%; left: 85%; }
    </style>
</head>
<body>

    <div class="bg-layer">
        <!-- Stationarily spinning dotted rings -->
        <div class="ring ring-1">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6c619" stroke-width="14" stroke-dasharray="6 12" /></svg>
        </div>
        <div class="ring ring-2">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6c619" stroke-width="14" stroke-dasharray="6 12" /></svg>
        </div>
        <div class="ring ring-3">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6c619" stroke-width="14" stroke-dasharray="6 12" /></svg>
        </div>
        <div class="ring ring-4">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6c619" stroke-width="14" stroke-dasharray="6 12" /></svg>
        </div>
        <div class="ring ring-5">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#e6c619" stroke-width="14" stroke-dasharray="6 12" /></svg>
        </div>

        <!-- Geometric shapes -->
        <div class="shape square s1"></div>
        <div class="shape circle s2"></div>
        <div class="triangle s3"></div>
        <div class="shape square s4"></div>
        <div class="shape circle s5"></div>
    </div>

</body>
</html>
